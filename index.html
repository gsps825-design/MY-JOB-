<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI Student Career & Job Portal — free job alerts, AI job matching, secure documents and application assistance for students.">
<meta name="robots" content="index, follow">
<title>Student Career &amp; Job Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ROYAL BLUE / WHITE / LIGHT GREY theme + green accents.
   Mobile-first. No frameworks — single file, zero build step.
   ============================================================ */
:root{
  --blue:#1d4ed8; --blue-dark:#1e3a8a; --blue-deep:#172e7c; --blue-soft:#eff6ff;
  --blue-line:#bfdbfe; --green:#16a34a; --green-soft:#f0fdf4; --green-line:#bbf7d0;
  --grey:#f1f5f9; --grey-2:#e2e8f0; --ink:#0f172a; --muted:#475569; --faint:#64748b;
  --amber:#b45309; --amber-soft:#fffbeb; --amber-line:#fde68a;
  --red:#b91c1c; --red-soft:#fef2f2; --red-line:#fecaca;
  --card:#ffffff; --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.06);
  --font:'Inter','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--grey);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
img,svg{display:block}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
h1,h2,h3,h4{line-height:1.3;font-weight:700}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.hide{display:none!important}
.muted{color:var(--muted)}.faint{color:var(--faint);font-size:13px}
.center{text-align:center}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px}
.row.wrapf{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.grid3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.grid3{grid-template-columns:repeat(3,1fr)}}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;font-weight:600;font-size:14.5px;padding:11px 18px;border:1px solid transparent;transition:.15s;min-height:44px}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-dark)}
.btn.green{background:var(--green);color:#fff}
.btn.green:hover{filter:brightness(.94)}
.btn.ghost{background:#fff;color:var(--blue);border-color:var(--blue-line)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.danger{background:var(--red-soft);color:var(--red);border-color:var(--red-line)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn .spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.btn.ghost .spin{border-color:var(--blue-line);border-top-color:var(--blue)}
@keyframes sp{to{transform:rotate(360deg)}}
label.f{display:block;margin-bottom:14px}
label.f span{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px;color:var(--ink)}
label.f .req{color:var(--red)}
.input,select.input,textarea.input{width:100%;border:1.5px solid #cbd5e1;border-radius:10px;padding:11px 13px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,78,216,.14)}
textarea.input{resize:vertical;min-height:74px}
.hint{font-size:12.5px;color:var(--faint);margin-top:5px}
.err{font-size:13px;color:var(--red);margin-top:6px}
.checkline{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.checkline input{margin-top:3px;accent-color:var(--blue);width:16px;height:16px;flex:none}

/* ---------- cards / badges / chips ---------- */
.card{background:var(--card);border:1px solid var(--grey-2);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card.pad0{padding:0}
.card h3{font-size:16.5px;margin-bottom:4px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.3px;padding:3px 9px;border-radius:999px;text-transform:uppercase}
.b-green{background:var(--green-soft);color:var(--green);border:1px solid var(--green-line)}
.b-blue{background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue-line)}
.b-amber{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
.b-red{background:var(--red-soft);color:var(--red);border:1px solid var(--red-line)}
.b-grey{background:var(--grey);color:var(--muted);border:1px solid var(--grey-2)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-soft);color:var(--blue-dark);border:1px solid var(--blue-line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip button{border:0;background:transparent;color:inherit;font-weight:800;font-size:14px;line-height:1;padding:0 0 0 2px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dashed var(--grey-2);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600;text-align:right}
.kv span{color:var(--muted);flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.g{background:var(--green)}.dot.a{background:#f59e0b}.dot.r{background:var(--red)}.dot.b{background:var(--blue)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;z-index:200;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:#14532d}#toast.bad{background:#7f1d1d}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--grey-2)}
.top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--blue-dark);font-size:15.5px;white-space:nowrap}
.logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--blue-dark));display:grid;place-items:center;flex:none}
.logo .mark svg{width:19px;height:19px}
.hbtn{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid var(--grey-2);background:#fff;display:grid;place-items:center;color:var(--muted)}
.hbtn:hover{border-color:var(--blue-line);color:var(--blue)}
.hbtn svg{width:19px;height:19px}
.hbtn .ndot{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
.langtog{border:1.5px solid var(--blue-line);background:var(--blue-soft);color:var(--blue-dark);border-radius:999px;font-weight:700;font-size:12.5px;padding:7px 13px;min-height:0}

/* ---------- landing ---------- */
.hero{background:linear-gradient(160deg,var(--blue-deep),var(--blue) 55%,#2563eb);color:#fff;padding:44px 0 54px}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.4px}
.hero h1{font-size:clamp(26px,6vw,40px);margin:16px 0 12px;max-width:640px}
.hero p.sub{font-size:16px;opacity:.92;max-width:560px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.hero .cta .btn.white{background:#fff;color:var(--blue-dark)}
.hero .cta .btn.line{border-color:rgba(255,255,255,.5);color:#fff;background:transparent}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:34px;max-width:520px}
.stats .s{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px 14px}
.stats .s b{font-size:20px;display:block}
.stats .s span{font-size:12px;opacity:.85}
.sect{padding:34px 0}
.sect>.wrap>h2{font-size:21px;margin-bottom:6px}
.sect>.wrap>p.lead{color:var(--muted);margin-bottom:20px;font-size:14.5px}
.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.catgrid{grid-template-columns:repeat(4,1fr)}}
.catcard{background:#fff;border:1px solid var(--grey-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:.15s;text-align:left}
.catcard:hover{border-color:var(--blue-line);box-shadow:var(--shadow);transform:translateY(-2px)}
.catcard b{font-size:13.5px;color:var(--ink)}
.catcard span{font-size:12px;color:var(--faint)}
.featrow{display:grid;gap:12px}
@media(min-width:760px){.featrow{grid-template-columns:repeat(2,1fr)}}
.feat{background:#fff;border:1px solid var(--grey-2);border-radius:12px;padding:16px;display:flex;gap:13px}
.feat .ic{width:40px;height:40px;border-radius:10px;background:var(--blue-soft);display:grid;place-items:center;flex:none;color:var(--blue)}
.feat .ic.g{background:var(--green-soft);color:var(--green)}
.feat b{display:block;font-size:14.5px;margin-bottom:3px}
.feat p{font-size:13px;color:var(--muted)}
.steps{counter-reset:st;display:grid;gap:12px}
@media(min-width:760px){.steps{grid-template-columns:repeat(2,1fr)}}
.step{background:#fff;border:1px solid var(--grey-2);border-radius:12px;padding:16px 16px 16px 52px;position:relative;font-size:13.5px;color:var(--muted)}
.step::before{counter-increment:st;content:counter(st);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:8px;background:var(--blue);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.step b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.trust{background:#fff;border-top:1px solid var(--grey-2);border-bottom:1px solid var(--grey-2);padding:22px 0}
.trust .wrap{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.trust .t{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.trust .t svg{width:17px;height:17px;color:var(--green)}
footer.site{background:var(--blue-dark);color:#cbd5e1;padding:30px 0 40px;margin-top:20px}
footer.site a{color:#e2e8f0}
footer.site .cols{display:flex;flex-wrap:wrap;gap:30px;justify-content:space-between}
footer.site h4{color:#fff;font-size:14px;margin-bottom:9px}
footer.site ul{list-style:none;font-size:13.5px}
footer.site li{margin-bottom:7px}
footer.site .fine{margin-top:22px;font-size:12px;color:#94a3b8;border-top:1px solid rgba(255,255,255,.14);padding-top:14px}

/* ---------- auth ---------- */
.authwrap{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:26px 16px}
.authcard{width:100%;max-width:430px;background:#fff;border:1px solid var(--grey-2);border-radius:16px;box-shadow:var(--shadow);padding:26px 22px}
.authcard h2{font-size:20px;margin-bottom:4px}
.authtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--grey);padding:5px;border-radius:11px;margin-bottom:20px}
.authtabs button{border:0;background:transparent;padding:9px;border-radius:8px;font-weight:600;color:var(--muted);font-size:14px}
.authtabs button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(15,23,42,.12)}

/* ---------- app shell ---------- */
.shell{display:flex;min-height:calc(100vh - 60px)}
aside.side{display:none}
@media(min-width:1024px){
  aside.side{display:block;width:232px;flex:none;background:#fff;border-right:1px solid var(--grey-2);padding:18px 12px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
  main.content{flex:1;min-width:0;padding:22px 26px 60px}
}
.side .usercard{background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:12px;padding:12px;margin-bottom:14px}
.side .usercard b{display:block;font-size:14px;color:var(--blue-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .usercard span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
nav.snav{display:flex;flex-direction:column;gap:2px}
nav.snav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px}
nav.snav a svg{width:18px;height:18px;flex:none}
nav.snav a:hover{background:var(--grey);color:var(--ink)}
nav.snav a.on{background:var(--blue-soft);color:var(--blue-dark)}
nav.snav .grp{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--faint);text-transform:uppercase;padding:14px 12px 4px}
main.content{padding:16px 16px 96px;flex:1;min-width:0}
@media(min-width:1024px){main.content{padding:22px 26px 60px}}
.pgtitle{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pgtitle h2{font-size:19px}
.pgtitle p{font-size:13.5px;color:var(--muted);margin-top:2px}

/* ---------- bottom nav (mobile) ---------- */
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--grey-2);display:flex;z-index:70;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:1024px){nav.bottom{display:none}}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;font-size:10.5px;font-weight:600;color:var(--faint)}
nav.bottom a svg{width:21px;height:21px}
nav.bottom a.on{color:var(--blue)}
nav.bottom a.on svg{color:var(--blue)}
nav.bottom a svg{color:#94a3b8}

/* ---------- more sheet ---------- */
#moresheet{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:90;display:none}
#moresheet.open{display:block}
#moresheet .panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto}
#moresheet .bar{width:42px;height:4px;border-radius:4px;background:var(--grey-2);margin:0 auto 14px}
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mlist a{display:flex;align-items:center;gap:9px;border:1px solid var(--grey-2);border-radius:11px;padding:12px;font-weight:600;font-size:13px;color:var(--ink)}
.mlist a svg{width:17px;height:17px;color:var(--blue);flex:none}

/* ---------- job cards ---------- */
.job{background:#fff;border:1px solid var(--grey-2);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.job .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.job h4{font-size:15.5px;line-height:1.35}
.job .org{font-size:13px;color:var(--muted);margin-top:2px}
.job .facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.job .facts .f{display:flex;align-items:center;gap:5px}
.job .facts svg{width:14px;height:14px;color:var(--faint)}
.job .dates{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px}
.job .dates .d{background:var(--grey);border-radius:8px;padding:5px 10px;color:var(--muted)}
.job .dates .d b{color:var(--ink)}
.job .dates .d.warn b{color:var(--amber)}
.job .dates .d.past b{color:var(--red)}
.job .actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--grey-2);padding-top:12px;margin-top:2px}
.job .src{font-size:11.5px;color:var(--faint)}
.matchbar{height:7px;border-radius:6px;background:var(--grey-2);overflow:hidden}
.matchbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#22c55e);border-radius:6px}
.reasons{list-style:none;font-size:12.5px;color:var(--muted);display:grid;gap:4px}
.reasons li{display:flex;gap:7px;align-items:flex-start}
.reasons li svg{width:14px;height:14px;flex:none;margin-top:2px}
.reasons li.ok svg{color:var(--green)}
.reasons li.no svg{color:var(--red)}

/* ---------- chat ---------- */
.chatbox{display:flex;flex-direction:column;gap:10px;min-height:46vh}
.chatmsg{max-width:86%;padding:11px 14px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.chatmsg.bot{background:#fff;border:1px solid var(--grey-2);border-bottom-left-radius:5px;align-self:flex-start}
.chatmsg.me{background:var(--blue);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.chatinput{display:flex;gap:8px;position:sticky;bottom:0}
.chatinput .input{flex:1}
.qchips{display:flex;gap:7px;flex-wrap:wrap}
.qchips button{border:1px solid var(--blue-line);background:var(--blue-soft);color:var(--blue-dark);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600}

/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column}
.tl .tstep{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl .tstep:last-child{padding-bottom:2px}
.tl .tstep::before{content:"";position:absolute;left:10px;top:24px;bottom:0;width:2px;background:var(--grey-2)}
.tl .tstep:last-child::before{display:none}
.tl .tdot{width:22px;height:22px;border-radius:50%;background:var(--grey-2);display:grid;place-items:center;flex:none}
.tl .tstep.done .tdot{background:var(--green)}
.tl .tstep.now .tdot{background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.tl .tdot svg{width:12px;height:12px;color:#fff}
.tl b{font-size:13.5px;display:block}
.tl span{font-size:12px;color:var(--faint)}

/* ---------- table (admin / desktop lists) ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--grey-2);border-radius:12px;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
table.tbl th{background:var(--grey);text-align:left;padding:10px 12px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
table.tbl td{padding:11px 12px;border-top:1px solid var(--grey-2);vertical-align:middle}
table.tbl tr:hover td{background:#f8fafc}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--grey-2);background:#fff;border-radius:999px;padding:8px 15px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.count-pill{background:var(--grey);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--grey-2);border-radius:12px;padding:14px}
.kpi b{font-size:22px;display:block;color:var(--blue-dark)}
.kpi span{font-size:12px;color:var(--muted)}

/* ---------- legal ---------- */
.legal{background:#fff;border:1px solid var(--grey-2);border-radius:var(--radius);padding:24px;max-width:860px}
.legal h2{font-size:20px;margin-bottom:4px}
.legal h3{font-size:15.5px;margin:18px 0 6px;color:var(--blue-dark)}
.legal p,.legal li{font-size:14px;color:var(--muted);margin-bottom:8px}
.legal ul{padding-left:20px}
.legal .updated{font-size:12.5px;color:var(--faint);margin-bottom:14px}

/* ---------- setup screen ---------- */
#setup-screen{min-height:100vh;background:linear-gradient(160deg,var(--blue-deep),var(--blue));padding:34px 16px;display:grid;place-items:start center}
.setup-card{max-width:720px;width:100%;background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.setup-card .hd{background:var(--blue-soft);border-bottom:1px solid var(--blue-line);padding:22px 24px}
.setup-card .hd h1{font-size:19px;color:var(--blue-dark)}
.setup-card .bd{padding:22px 24px}
.setup-card ol{padding-left:22px;display:grid;gap:10px;font-size:14px;color:var(--muted)}

const iso = (d=new Date()) => d.toISOString();
const todayISO = () => iso().slice(0,10);
const fmtDate = (s) => { if(!s) return '—'; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleDateString(LANG==='hi'?'hi-IN':'en-IN', {day:'numeric',month:'short',year:'numeric'}); };
const fmtDT = (s) => { if(!s) return '—'; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleString(LANG==='hi'?'hi-IN':'en-IN', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); };
const daysTo = (s) => Math.ceil((new Date(s+'T23:59:59') - Date.now()) / 86400000);
const ageFrom = (dob) => { if(!dob) return null; const d=new Date(dob); if(isNaN(d)) return null; const n=new Date(); let a=n.getFullYear()-d.getFullYear(); const m=n.getMonth()-d.getMonth(); if(m<0||(m===0&&n.getDate()<d.getDate())) a--; return a; };
const money = (n) => '₹' + Number(n||0).toLocaleString(LANG==='hi'?'hi-IN':'en-IN');
const randomId = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : Date.now().toString(36)+Math.random().toString(36).slice(2));
async function sha256Hex(buf){ const h = await crypto.subtle.digest('SHA-256', buf); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join(''); }

   ================================================================ */
const configMissing = !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.includes('PASTE_') ||
                      !FIREBASE_CONFIG.projectId || FIREBASE_CONFIG.projectId.includes('PASTE_');
let app, auth, fsdb, storage;
const S = { user:null, isAdmin:false, emailVerified:false, profile:null, edu:[], docs:[], apps:[],
            jobs:null, jobsAt:0, notifs:[], tx:[], view:'home', unread:0, booted:false };

function initFirebase(){
  app = initializeApp(FIREBASE_CONFIG);
  auth = getAuth(app);
  fsdb = getFirestore(app);
  storage = getStorage(app);
}

/* ---------- data access ---------- */
const colRef = (name) => collection(fsdb, name);
async function fetchJobs(force){
  if(S.jobs && !force && Date.now()-S.jobsAt < 5*60*1000) return S.jobs;
  const snap = await getDocs(query(colRef('jobs'), where('status','==','PUBLISHED')));
  S.jobs = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  S.jobsAt = Date.now();
  return S.jobs;
}
async function loadMine(){
  if(!S.user) return;
  const [p, edu, docs, apps, txs] = await Promise.all([
    getDoc(doc(fsdb,'users',S.user.uid)),
    getDocs(query(colRef('studentEducation'), where('userId','==',S.user.uid))),
    getDocs(query(colRef('studentDocuments'), where('userId','==',S.user.uid))),
    getDocs(query(colRef('applications'), where('userId','==',S.user.uid))),
    getDocs(query(colRef('walletTransactions'), where('userId','==',S.user.uid))),
  ]);
  S.profile = p.exists() ? p.data() : null;
  S.edu = edu.docs.map(d=>({id:d.id,...d.data()}));
  S.docs = docs.docs.map(d=>({id:d.id,...d.data()}));
  S.apps = apps.docs.map(d=>({id:d.id,...d.data()}));
  S.tx = txs.docs.map(d=>({id:d.id,...d.data()}));
  await loadNotifs();
  let bal = 0;
  try{ const w = await getDoc(doc(fsdb,'wallets',S.user.uid)); if(w.exists()) bal = Number(w.data().balance)||0; }catch(e){}
  S.balance = bal;
}
async function loadNotifs(){
  const snap = await getDocs(query(colRef('notifications'), where('userId','==',S.user.uid)));
  S.notifs = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  S.unread = S.notifs.filter(n=>!n.read).length;
}
async function audit(action, target, meta){
  try{
    await addDoc(colRef('auditLogs'), { actorId:S.user?.uid||null, actorEmail:S.user?.email||null, action, target:target||null, meta:meta||{}, at:iso() });
  }catch(e){ /* audit is best-effort on client; server/functions write the authoritative trail */ }
}

/* ---------- profile completeness ---------- */
function profileScore(){
  const p = S.profile || {}; const done = [
    p.fullName, p.mobile, p.dateOfBirth, p.state, p.district, p.resCategory,
    (p.skills&&p.skills.length), p.experience, S.edu.length>0,
    S.docs.some(d=>d.type==='RESUME') || S.docs.length>=3,
  ].filter(Boolean).length;
  return Math.round(done/10*100);
}

/* ================================================================
   AUTH
   ================================================================ */
function isGmail(v){ return /^[a-z0-9](?:[a-z0-9._%+-]{2,})?@gmail\.com$/i.test(String(v||'').trim()); }
function passwordProblems(p){ const errs=[]; if(!p||p.length<8) errs.push(t('e_pass')); if(p&&!/[a-zA-Z]/.test(p)) errs.push(t('e_pass')); if(p&&!/\d/.test(p)) errs.push(t('e_pass')); return [...new Set(errs)]; }

async function doRegister(f){
  const d = Object.fromEntries(new FormData(f).entries());
  const problems = [];
  if(!d.fullName || d.fullName.trim().length<2) problems.push(t('e_name'));
  if(!isGmail(d.email)) problems.push(t('e_gmail'));
  problems.push(...passwordProblems(d.password));
  if(d.password!==d.confirmPassword) problems.push(t('e_pass_match'));
  if(!/^[6-9]\d{9}$/.test((d.mobile||'').replace(/\D/g,''))) problems.push(t('e_mobile'));
  const dob=new Date(d.dateOfBirth); if(isNaN(dob)||dob>new Date()) problems.push(t('e_dob'));
  if(!d.consent) problems.push(t('e_terms'));
  const ebox=$('#regerr');
  if(problems.length){ ebox.innerHTML=problems.map(x=>`<div>${esc(x)}</div>`).join(''); return; }
  ebox.innerHTML='';
  const btn=f.querySelector('button[type=submit]'); busy(btn,true,t('register'));
  try{
    const cred = await createUserWithEmailAndPassword(auth, d.email.trim(), d.password);
    await updateProfile(cred.user,{ displayName:d.fullName.trim() });
    await setDoc(doc(fsdb,'users',cred.user.uid),{
      fullName:d.fullName.trim(), email:d.email.trim().toLowerCase(), mobile:d.mobile.replace(/\D/g,''),
      dateOfBirth:d.dateOfBirth, role:'STUDENT', status:'ACTIVE', profileVerified:false,
      createdAt:iso(), skills:[], preferredCategories:[], state:'', district:'', resCategory:'', experience:'',
    });
    await sendEmailVerification(cred.user);
    await audit('AUTH_REGISTER', cred.user.uid, { email:d.email });
    toast(t('verify_sent'),'ok');
    signOut(auth).then(()=>{ location.hash='#/login'; });
  }catch(err){
    const m = String(err?.code||err);
    ebox.textContent = m.includes('email-already-in-use') ? t('acct_exists')
      : m.includes('weak-password') ? t('weak_or_used') : (t('weak_or_used')+' ('+esc(err?.message||'')+')');
  }
  busy(btn,false);
}

async function doLogin(f){
  const d = Object.fromEntries(new FormData(f).entries());
  const btn=f.querySelector('button[type=submit]'); busy(btn,true,t('login'));
  try{
    const cred = await signInWithEmailAndPassword(auth, d.email.trim(), d.password);
    if(!cred.user.emailVerified){ toast(t('not_verified'),'bad'); $('#loginerr').textContent=t('not_verified'); await signOut(auth); }
    else { await audit('AUTH_LOGIN', cred.user.uid, {}); }
  }catch(err){ $('#loginerr').textContent=t('wrong_cred'); }
  busy(btn,false);
}
async function doReset(f){
  const d = Object.fromEntries(new FormData(f).entries());
  if(!isGmail(d.email)) return toast(t('e_gmail'),'bad');
  const btn=f.querySelector('button'); busy(btn,true,t('send'));
  try{ await sendPasswordResetEmail(auth, d.email.trim()); toast(t('reset_ok'),'ok'); f.reset(); }catch(e){ toast(e?.message||'Error','bad'); }
  busy(btn,false);
}
async function doLogout(){ await audit('AUTH_LOGOUT', S.user?.uid, {}); await signOut(auth); toast(t('logout_done')); location.hash='#/'; }

const routes = ['','home','login','register','legal','dashboard','profile','education','documents','jobs','recommended','assistant','applications','wallet','transactions','notifications','settings','admin'];
let currentLegal = 'privacy';

function go(v){ location.hash = '#/'+v; }
function route(){
  let v = (location.hash||'#/').replace(/^#\//,'').split('?')[0];
  if(v.startsWith('legal')){ currentLegal = v.split('/')[1] || 'privacy'; v = 'legal'; }
  if(!routes.includes(v)) v = 'home';
  S.view = v || 'home';
  render();
  window.scrollTo({top:0});
}

function isStudentView(v){ return ['dashboard','profile','education','documents','jobs','recommended','assistant','applications','wallet','transactions','notifications','settings'].includes(v); }

function render(){
  $('#setup-screen').classList.add('hide'); $('#app').classList.remove('hide');
  const v = S.view;
  /* header buttons */
  const authed = !!S.user;
  $('#bellbtn').classList.toggle('hide', !authed || isStudentView(v)===false && v!=='home');
  $('#logoutbtn').classList.toggle('hide', !authed);
  $('#brandname').textContent = LANG==='hi' ? PORTAL_SETTINGS.siteNameHi : PORTAL_SETTINGS.siteName;
  $('#langbtn').textContent = LANG==='hi' ? 'EN' : 'हिं';
  $('#belldot').textContent = S.unread; $('#belldot').classList.toggle('hide', !S.unread);
  $('#bellbtn').onclick = ()=>go('notifications');
  $('#logoutbtn').onclick = doLogout;
  $('#langbtn').onclick = ()=>{ LANG = LANG==='hi'?'en':'hi'; localStorage.setItem('portal_lang',LANG); route(); };

  if(configMissing){ renderSetup(); return; }
  if(v==='legal'){ renderLegal(currentLegal); return; }
  if(!authed && isStudentView(v)){ go('login'); return; }
  if(authed && (v==='login'||v==='register')){ go('dashboard'); return; }
  if(v==='admin'){ if(S.isAdmin) renderAdmin(); else renderNoAdmin(); return; }
  if(isStudentView(v)){ renderShell(v); return; }
  if(v==='login') renderAuth('login');
  else if(v==='register') renderAuth('register');
  else renderLanding();
}

/* ================================================================
   MATCHING ENGINE (transparent, client-side)
   ================================================================ */
function jobEligibility(job){
  const p = S.profile||{}; const reasons=[]; let ok=true;
  const top = S.edu.slice().sort((a,b)=>eduRank(b.level)-eduRank(a.level))[0];
  const age = ageFrom(p.dateOfBirth);
  const dEnd = job.applicationDeadline ? daysTo(job.applicationDeadline) : null;
  if(dEnd!==null && dEnd<0){ ok=false; reasons.push({ok:false, en:'Application closed on '+job.applicationDeadline, hi:'आवेदन '+job.applicationDeadline+' को बंद हो गया'}); }
  if(job.qualificationLevel && job.qualificationLevel!=='OTHER'){
    const need = eduRank(job.qualificationLevel);
    if(top && eduRank(top.level)>=need) reasons.push({ok:true, en:'Education: '+labelEdu(top.level)+' meets '+labelEdu(job.qualificationLevel), hi:'शिक्षा: '+labelEdu(top.level)+' — '+labelEdu(job.qualificationLevel)+' पूरी'});
    else { ok=false; reasons.push({ok:false, en:'Needs '+labelEdu(job.qualificationLevel)+' or higher', hi:labelEdu(job.qualificationLevel)+' या उससे अधिक चाहिए'}); }
  } else reasons.push({ok:true, en:'Open education requirement', hi:'शिक्षा की कोई खास शर्त नहीं'});
  if(age===null){ ok=false; reasons.push({ok:false, en:'Add date of birth in profile', hi:'प्रोफ़ाइल में जन्म तिथि जोड़ें'}); }
  else if(job.minAge && age<job.minAge){ ok=false; reasons.push({ok:false, en:'Minimum age '+job.minAge+' (you: '+age+')', hi:'न्यूनतम उम्र '+job.minAge+' (आपकी: '+age+')'}); }
  else if(job.maxAge && age>job.maxAge){ ok=false; reasons.push({ok:false, en:'Maximum age '+job.maxAge+' (you: '+age+')', hi:'अधिकतम उम्र '+job.maxAge+' (आपकी: '+age+')'}); }
  else if(age!==null) reasons.push({ok:true, en:'Age '+age+' within '+(job.minAge||18)+'–'+(job.maxAge||'—'), hi:'उम्र '+age+' सीमा '+(job.minAge||18)+'–'+(job.maxAge||'—')+' में'});
  return { ok, reasons };
}
function matchScore(job){
  const p = S.profile||{}; const top = S.edu.slice().sort((a,b)=>eduRank(b.level)-eduRank(a.level))[0];
  const age = ageFrom(p.dateOfBirth);
  const el = jobEligibility(job);
  let s = 0;
  if(top && job.qualificationLevel && eduRank(top.level)>=eduRank(job.qualificationLevel)) s+=30;
  else if(top) s+=10;
  if(age!==null && (!job.minAge||age>=job.minAge) && (!job.maxAge||age<=job.maxAge)) s+=25;
  const skills = (p.skills||[]).map(x=>x.toLowerCase());
  const jsk = String(job.skillsText||'').toLowerCase().split(/[,;]/).map(x=>x.trim()).filter(Boolean);
  const hits = jsk.filter(k=>skills.some(x=>x.includes(k)||k.includes(x))).length;
  s += Math.min(15, jsk.length? Math.round(hits/jsk.length*15) : 8);
  if(p.state && job.state && p.state===job.state) s+=10; else if(job.state===''||!job.state) s+=6;
  if((p.preferredCategories||[]).includes(job.category)) s+=10;
  s += Math.round(profileScore()/10);
  if(!el.ok) s = Math.min(s, 45);
  return Math.max(5, Math.min(100, s));
}
function jobClosed(job){ return job.applicationDeadline ? daysTo(job.applicationDeadline) < 0 : false; }

function jobCard(job, opts={}){
  const el = jobEligibility(job);
  const dl = job.applicationDeadline ? daysTo(job.applicationDeadline) : null;
  const closed = jobClosed(job);
  const canApply = S.user && S.emailVerified && !closed;
  const score = opts.score!==undefined ? opts.score : matchScore(job);
  return `<div class="job" data-job="${job.id}">
    <div class="head"><div><h4>${esc(job.title)}</h4><div class="org">${esc(job.organization)}${job.department?' · '+esc(job.department):''}</div></div>
      <span class="badge ${closed?'b-grey':'b-blue'}">${labelCat(job.category)}</span></div>
    <div class="facts">
      ${job.salaryText?`<span class="f">${svg.rupee}${esc(job.salaryText)}</span>`:''}
      ${job.vacancies?`<span class="f">${svg.users}${t('vac')}: ${esc(job.vacancies)}</span>`:''}
      ${job.minAge||job.maxAge?`<span class="f">${svg.user}${t('age')}: ${job.minAge||18}–${job.maxAge||'—'}</span>`:''}
      ${job.location?`<span class="f">${svg.pin}${esc(job.location)}</span>`:''}
    </div>
    <div class="dates">
      ${job.applicationStart?`<span class="d">${t('apply_start')}: <b>${fmtDate(job.applicationStart)}</b></span>`:''}
      ${job.applicationDeadline?`<span class="d ${closed?'past':(dl<=7?'warn':'')}">${t('last_date')}: <b>${fmtDate(job.applicationDeadline)}</b>${dl>=0?` · ${dl} ${t('days_left')}`:` · ${t('closed')}`}</span>`:''}
      ${job.feeGeneral!==undefined&&job.feeGeneral!==null?`<span class="d">${t('fee')}: <b>${Number(job.feeGeneral)?money(job.feeGeneral):'₹0'}</b></span>`:''}
    </div>
    ${opts.reasons?`<ul class="reasons">${el.reasons.map(r=>`<li class="${r.ok?'ok':'no'}">${r.ok?svg.check:svg.x}<span>${L(r)}</span></li>`).join('')}</ul>`:''}
    ${opts.score!==undefined?`<div><div class="spread mb8"><b class="faint">${t('match_score')}</b><b>${score}%</b></div><div class="matchbar"><i style="width:${score}%"></i></div></div>`:''}
    <div class="src">${job.verified?`<span class="badge b-green">${t('verified_badge')}</span> `:''}${t('source')}: ${esc(job.sourceName||'—')}${job.sourceUrl?` · <a href="${esc(job.sourceUrl)}" target="_blank" rel="noopener noreferrer">${t('official_link')}</a>`:''}</div>
    <div class="actions">
      ${job.applyUrl?`<a class="btn ghost sm" href="${esc(job.applyUrl)}" target="_blank" rel="noopener noreferrer">${svg.ext} ${t('official_link')}</a>`:''}
      ${canApply?`<button class="btn primary sm" data-apply="${job.id}">${t('apply')}</button>`:''}
      ${S.user&&!S.emailVerified?`<span class="faint">${LANG==='hi'?'ईमेल सत्यापित करें':'Verify email to apply'}</span>`:''}
    </div></div>`;
}
async function applyToJob(jobId){
  const job = (S.jobs||[]).find(j=>j.id===jobId); if(!job) return;
  if(!S.emailVerified) return toast(t('verify_banner'),'bad');
  const el = jobEligibility(job);
  if(!el.ok && !confirm(LANG==='hi'?'आप इस पद के लिए पूरी तरह योग्य नहीं लगते। फिर भी ड्राफ्ट बनाएं?':'You may not be fully eligible. Still create a draft?')) return;
  try{
    await addDoc(colRef('applications'), {
      userId:S.user.uid, jobId:job.id, jobTitle:job.title, organization:job.organization, category:job.category||'',
      status:'DRAFT', referenceNumber:'', applyUrl:job.applyUrl||'', applicationDeadline:job.applicationDeadline||'',
      formData: { fullName:S.profile?.fullName||S.user.displayName||'', email:S.user.email, mobile:S.profile?.mobile||'',
                  dateOfBirth:S.profile?.dateOfBirth||'', education:S.edu.map(e=>({level:e.level,board:e.board,year:e.year,percentage:e.percentage})),
                  resCategory:S.profile?.resCategory||'', state:S.profile?.state||'' },
      history:[{status:'DRAFT', at:iso(), by:'student'}],
      createdAt:iso(), updatedAt:iso(),
    });
    await audit('APPLICATION_DRAFT_CREATED', jobId, { title:job.title });
    try{ await loadMine(); }catch(e){}
    toast(t('apply_draft_ok'),'ok'); go('applications');
  }catch(e){ toast(e?.message||'Error','bad'); }
}

      </tbody></table></div></div>
    <p class="faint">${LANG==='hi'?'अपलोड के बाद दस्तावेज़ “पेंडिंग” रहता है; एडमिन सत्यापित करता है। हर एक्सेस लॉग होता है।':'After upload a document stays “Pending”; an admin verifies it. Every access is logged.'}</p>`;
  $$('[data-file]').forEach(inp=> inp.onchange = ()=>uploadDoc(inp, inp.dataset.file));
  $$('[data-dl]').forEach(a=> a.onclick = async (e)=>{ e.preventDefault(); try{ const url=await getDownloadURL(sRef(storage, S.docs.find(d=>d.id===a.dataset.dl).storagePath)); window.open(url,'_blank','noopener'); await audit('DOCUMENT_DOWNLOADED', a.dataset.dl, {}); }catch(err){ toast(err?.message||'Error','bad'); } });
  $$('[data-del]').forEach(b=> b.onclick = ()=>removeDocument(b.dataset.del));
}
async function uploadDoc(inp, type){
  if(!S.emailVerified) return toast(t('verify_banner'),'bad');
  const file = inp.files[0]; if(!file) return;
  if(!DOC_ALLOWED_MIME.includes(file.type)) return toast(LANG==='hi'?'केवल PDF / JPG / PNG मान्य है।':'Only PDF / JPG / PNG allowed.','bad');
  if(file.size>DOC_MAX_BYTES) return toast(LANG==='hi'?'फ़ाइल 10MB से छोटी होनी चाहिए।':'File must be under 10MB.','bad');
  const docId = randomId();
  const ext = file.type.includes('pdf')?'pdf':(file.type.includes('png')?'png':'jpg');
  const path = `studentDocuments/${S.user.uid}/${docId}.${ext}`;
  try{
    toast(t('uploading'));
    const buf = await file.arrayBuffer();
    const hash = await sha256Hex(buf);
    await uploadBytes(sRef(storage,path), file, { contentType:file.type, customMetadata:{ ownerUid:S.user.uid, docType:type, sha256:hash } });
    const prev = S.docs.find(d=>d.type===type);
    if(prev){ try{ await deleteObject(sRef(storage,prev.storagePath)); await deleteDoc(doc(fsdb,'studentDocuments',prev.id)); }catch(e){} }
    await setDoc(doc(fsdb,'studentDocuments',docId), {
      userId:S.user.uid, type, fileName:file.name.slice(0,120), mimeType:file.type, sizeBytes:file.size,
      storagePath:path, sha256:hash, status:'PENDING', uploadedAt:iso(),
    });
    await audit('DOCUMENT_UPLOADED', docId, { type, size:file.size });
    await loadMine(); toast(t('uploaded'),'ok'); route();
  }catch(err){ toast(err?.message||'Upload failed','bad'); }
}
async function removeDocument(id){
  if(!confirm(LANG==='hi'?'दस्तावेज़ हटाएं?':'Delete this document?')) return;
  const d = S.docs.find(x=>x.id===id); if(!d) return;
  try{
    try{ await deleteObject(sRef(storage,d.storagePath)); }catch(e){}
    await deleteDoc(doc(fsdb,'studentDocuments',id));
    await audit('DOCUMENT_DELETED', id, { type:d.type });
    await loadMine(); toast(t('delete')+' ok'); route();
  }catch(err){ toast(err?.message||'Error','bad'); }
}

          const done=a.status==='SUCCESS'||a.status==='UNDER_REVIEW'||a.status==='INTERVIEW'||steps.indexOf(a.status)>i;
          const now=a.status===s;
          return `<div class="tstep ${done?'done':''} ${now?'now':''}"><span class="tdot">${done||now?svg.check:''}</span><div><b>${labelSt(s)}</b>${now?`<span>${fmtDT(a.updatedAt)}</span>`:''}</div></div>`; }).join('')}</div>

          ${['DRAFT','READY','APPROVED','SUBMITTED'].includes(a.status)?`<button class="btn danger sm" data-wd="${a.id}">${t('withdraw')}</button>`:''}
        </div></div>`; }).join('')
      : `<div class="empty">${svg.list}<p>${t('no_apps')}</p></div>`}`;

  });

}
async function updateApp(id, patch){
  const a=S.apps.find(x=>x.id===id); if(!a) return;
  try{
    const history=[...(a.history||[]),{status:patch.status, at:iso(), by:'student'}];
    await updateDoc(doc(fsdb,'applications',id), {...patch, history, updatedAt:iso()});
    await audit('APPLICATION_'+patch.status, id, {}); await loadMine(); route();
  }catch(e){ toast(e?.message||'Error','bad'); }
}

}
async function runTransactionCompat(docRef, fn){
  const { runTransaction } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  await runTransaction(fsdb, async(tr)=>{ const w=await tr.get(docRef); const next=fn(w.exists()?w.data():null); tr.set(docRef, next, {merge:true}); });
}

      if($('#n-to').value==='ALL'){
        const users=await admAll('users',500);
        const active=users.filter(u=>u.status==='ACTIVE');

      await audit('ADMIN_NOTIFICATION_SENT', title, {});

}
const chunk=(arr,n)=>{ const out=[]; for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n)); return out; };

<!-- ============================================================
FIRESTORE SECURITY RULES — paste in Firebase Console → Firestore → Rules

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function isSignedIn() { return request.auth != null; }
    function isOwner(uid) { return isSignedIn() && request.auth.uid == uid; }
    function isAdmin() { return isSignedIn() && request.auth.token.admin == true; }
    function isVerifiedStudent() {
      return isSignedIn() && request.auth.token.admin != true
        && get(/databases/$(database)/documents/users/$(request.auth.uid)).data.status == 'ACTIVE';
    }
    match /users/{userId} {
      allow read: if isOwner(userId) || isAdmin();
      allow create: if isOwner(userId) && request.resource.data.role == 'STUDENT' && request.resource.data.status == 'ACTIVE';
      allow update: if (isOwner(userId)
          && request.resource.data.role == resource.data.role
          && request.resource.data.status == resource.data.status
          && request.resource.data.profileVerified == resource.data.profileVerified)
        || isAdmin();
      allow delete: if false;
    }
    match /studentEducation/{eduId} {
      allow read: if isOwner(resource.data.userId) || isAdmin();
      allow write: if isVerifiedStudent() && request.resource.data.userId == request.auth.uid;
      allow delete: if isOwner(resource.data.userId) || isAdmin();
    }
    match /studentDocuments/{docId} {
      allow read: if isOwner(resource.data.userId) || isAdmin();
      allow create: if isVerifiedStudent() && request.resource.data.userId == request.auth.uid;
      allow update: if isAdmin();
      allow delete: if isOwner(resource.data.userId) || isAdmin();
    }
    match /documentAccess/{logId} {
      allow read: if isAdmin() || isOwner(resource.data.accessorId);
      allow create: if isSignedIn();
      allow update, delete: if false;
    }
    match /jobs/{jobId} {
      allow read: if true;
      allow create, update, delete: if isAdmin();
    }
    match /jobMatches/{matchId} {
      allow read: if isOwner(resource.data.userId) || isAdmin();
      allow write: if false;
    }
    match /applications/{appId} {
      allow read: if isOwner(resource.data.userId) || isAdmin();
      allow create: if isVerifiedStudent() && request.resource.data.userId == request.auth.uid
        && request.resource.data.status == 'DRAFT' && request.resource.data.referenceNumber == '';
      allow update: if (isOwner(resource.data.userId)
          && request.resource.data.userId == resource.data.userId
          && request.resource.data.status in ['DRAFT','READY','APPROVED','SUBMITTED','WITHDRAWN'])
        || isAdmin();
      allow delete: if false;
    }
    match /wallets/{walletId} {
      allow read: if isOwner(walletId) || isAdmin();
      allow write: if isAdmin()
        && request.resource.data.balance >= 0 && request.resource.data.balance <= 1000;
    }
    match /walletTransactions/{txId} {
      allow read: if isOwner(resource.data.userId) || isAdmin();
      allow create: if isAdmin();
      allow update, delete: if false;

      allow update, delete: if isAdmin();
    }
    match /notifications/{notifId} {
      allow read: if isOwner(resource.data.userId) || isAdmin();
      allow update: if isOwner(resource.data.userId)
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['read']);
      allow create, delete: if isAdmin();
    }
    match /deletionRequests/{reqId} {
      allow read: if isOwner(resource.data.userId) || isAdmin();
      allow create: if isVerifiedStudent() && request.resource.data.userId == request.auth.uid;
      allow update, delete: if isAdmin();
    }
    match /emailLogs/{logId} { allow read: if isAdmin(); allow write: if false; }
    match /admins/{adminId}  { allow read: if isAdmin(); allow write: if false; }
    match /auditLogs/{logId} {
      allow read: if isAdmin();
      allow create: if isSignedIn();
      allow update, delete: if false;
    }
    match /loginEvents/{logId} { allow read: if isAdmin(); allow write: if false; }
    match /systemSettings/{key} { allow read: if isAdmin(); allow write: if false; }
    match /{document=**} { allow read, write: if false; }
  }
}

STORAGE RULES — Firebase Console → Storage → Rules
--------------------------------------------------
rules_version = '2';
service firebase.storage {
  match /b/{bucket}/o {
    function signedIn() { return request.auth != null; }
    function isAdmin() { return signedIn() && request.auth.token.admin == true; }
    function isOwner(uid) { return signedIn() && request.auth.uid == uid; }
    match /studentDocuments/{userId}/{allPaths=**} {
      allow read: if isOwner(userId) || isAdmin();
      allow create: if isOwner(userId)
        && request.resource.size <= 10 * 1024 * 1024
        && request.resource.contentType in ['application/pdf','image/jpeg','image/png'];
      allow update: if false;
      allow delete: if isOwner(userId) || isAdmin();
    }
    match /{allPaths=**} { allow read, write: if false; }
  }
}
